name: Coding Agent (Codex)

# 振り分け用のワークフローが、作成、修正、レビューの依頼ごとに手動実行 (workflow_dispatch) する。
# 入力の形式は、すべてのエージェントのワークフローで共通にしている (仕様の 2.2)。
# モデルと effort は依頼に含まれる値をそのまま使い、このワークフローには書かない (agents.json で決める)。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 依頼の種類 (create、fix、review)
        type: string
        required: true
      stage:
        description: 段階
        type: string
        required: true
      issue-number:
        description: 対象の Issue の番号
        type: string
        required: true
      pull-request-number:
        description: 対象の PR の番号 (作成のときは空)
        type: string
        required: false
        default: ''
      target-sha:
        description: 作業を始めるコミット (修正やレビューのときは、PR の head)
        type: string
        required: true
      request-run-id:
        description: 依頼の Artifact を保存した、振り分け用のワークフローの実行の ID
        type: string
        required: true
      request-id:
        description: 依頼の識別子 (Artifact の中のファイル名)
        type: string
        required: true

permissions: {}

# 同じ PR のレビューは、新しい依頼が来たら古いものを取り消し、最新のコミットだけをレビューする。
# 作成と修正は、同じ Issue や PR への作業を 1 つずつ行う (作業の途中で取り消さない)
concurrency:
  group: coding-agent-codex-${{ inputs.mode == 'review' && 'review' || 'work' }}-${{ inputs.pull-request-number || inputs.issue-number }}
  cancel-in-progress: ${{ inputs.mode == 'review' }}

jobs:
  work:
    name: Codex による作業
    if: vars.CODING_AGENT_ENABLED == 'true' && (inputs.mode == 'create' || inputs.mode == 'fix')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 作成担当には書き込み権限を持つトークンを渡さない (push と PR の作成は publish ジョブが行う)
    permissions:
      contents: read
      # 依頼の Artifact を、振り分け用のワークフローの実行から取得する
      actions: read
    outputs:
      agent: ${{ steps.request.outputs.agent }}
      kind: ${{ steps.request.outputs.kind }}
    steps:
      - name: 作業を始めるコミットをチェックアウトする
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false

      # 指示やスクリプトは既定ブランチのものを使い、作業ディレクトリの外に置く (変更内容に含めないため)
      - name: 既定ブランチの仕組みをチェックアウトする
        uses: actions/checkout@v7
        with:
          path: coding-agent-trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: 既定ブランチの仕組みを作業ディレクトリの外に移す
        run: mv coding-agent-trusted "$RUNNER_TEMP/trusted"

      - name: 依頼を取得する
        uses: actions/download-artifact@v8
        with:
          name: coding-agent-requests
          run-id: ${{ inputs.request-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/coding-agent-requests

      - name: 依頼の内容を確かめる
        id: request
        env:
          REQUEST_ID: ${{ inputs.request-id }}
          MODE: ${{ inputs.mode }}
          TARGET_SHA: ${{ inputs.target-sha }}
          REQUEST_DIR: ${{ runner.temp }}/coding-agent-requests
          TRUSTED: ${{ runner.temp }}/trusted
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
            echo "::error::依頼の識別子の形式が正しくありません: $REQUEST_ID"
            exit 1
          fi
          request="$REQUEST_DIR/$REQUEST_ID.json"
          if [ "$(jq -r '.mode' "$request")" != "$MODE" ] || [ "$(jq -r '.targetSha' "$request")" != "$TARGET_SHA" ]; then
            echo "::error::依頼の内容が、ワークフローの入力と一致しません"
            exit 1
          fi
          echo "agent=$(jq -r '.agent' "$request")" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r '.execution.model // ""' "$request")" >> "$GITHUB_OUTPUT"
          echo "effort=$(jq -r '.execution.effort // ""' "$request")" >> "$GITHUB_OUTPUT"
          # 実装計画は、ファイルを変更せずに計画を出力する。文書の段階は、作業ディレクトリのファイルだけを変更する
          case "$(jq -r '.stage' "$request")" in
            planning)
              echo "kind=planning" >> "$GITHUB_OUTPUT"
              echo "permission-profile=:read-only" >> "$GITHUB_OUTPUT"
              echo "output-schema=$TRUSTED/.github/coding-agent/plan-schema.json" >> "$GITHUB_OUTPUT"
              ;;
            implementation)
              # 実装には、ネットワークや Docker を使える権限の設計が別に必要なため、まだ対応していない
              echo "::error::Codex による実装タスクには、まだ対応していません (agents.json の roles.implementation.implementers を見直してください)"
              exit 1
              ;;
            *)
              echo "kind=change" >> "$GITHUB_OUTPUT"
              echo "permission-profile=:workspace" >> "$GITHUB_OUTPUT"
              echo "output-schema=$TRUSTED/.github/coding-agent/result-schema.json" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: 作業の指示を作る
        env:
          REQUEST_FILE: ${{ runner.temp }}/coding-agent-requests/${{ inputs.request-id }}.json
          TRUSTED: ${{ runner.temp }}/trusted
        run: |
          set -euo pipefail
          node "$TRUSTED/.github/scripts/coding-agent/author-prompt.mjs" \
            --request "$REQUEST_FILE" \
            --prompts "$TRUSTED/.github/coding-agent/prompts" \
            --prompt-out "$RUNNER_TEMP/author-prompt.md"

      # Codex は bubblewrap で、書き込める場所とネットワークを制限する (permission-profile)
      - name: Codex を隔離する bubblewrap を用意する
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 以降では、AppArmor の既定の設定で、bubblewrap がユーザー名前空間を作れない。
          # 制限が有効なときだけ、bubblewrap 自体に許可を与える (bubblewrap の中で動くコマンドには与えない)
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = '1' ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor
          fi
          bwrap --ro-bind / / --unshare-pid true
          echo "bubblewrap を使えることを確かめました"

      - name: Codex で作業する
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/author-prompt.md
          permission-profile: ${{ steps.request.outputs.permission-profile }}
          output-schema-file: ${{ steps.request.outputs.output-schema }}
          output-file: ${{ runner.temp }}/coding-agent-output.json
          model: ${{ steps.request.outputs.model }}
          effort: ${{ steps.request.outputs.effort }}
          # 振り分け用のワークフロー (github-actions[bot]) からの手動実行を許可する
          allow-bots: true

      - name: 計画をまとめる
        if: steps.request.outputs.kind == 'planning'
        env:
          OUTPUT_FILE: ${{ runner.temp }}/coding-agent-output.json
          PLAN_DIR: ${{ runner.temp }}/coding-agent-plan
        run: |
          set -euo pipefail
          if [ ! -s "$OUTPUT_FILE" ]; then
            echo "::error::作成担当が計画を出力しませんでした"
            exit 1
          fi
          mkdir -p "$PLAN_DIR"
          cp "$OUTPUT_FILE" "$PLAN_DIR/plan.json"
          jq . "$PLAN_DIR/plan.json"

      - name: 計画を保存する
        if: steps.request.outputs.kind == 'planning'
        uses: actions/upload-artifact@v7
        with:
          name: coding-agent-plan
          path: ${{ runner.temp }}/coding-agent-plan
          retention-days: 30

      - name: 変更内容をまとめる
        if: steps.request.outputs.kind == 'change'
        env:
          TARGET_SHA: ${{ inputs.target-sha }}
          OUTPUT_FILE: ${{ runner.temp }}/coding-agent-output.json
          RESULT_DIR: ${{ runner.temp }}/coding-agent-result
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          if [ -f "$OUTPUT_FILE" ]; then
            cp "$OUTPUT_FILE" "$RESULT_DIR/result.json"
          fi
          # エージェントが指示に反してコミットしていても漏れないよう、作業を始めたコミットと比較する
          git add --all
          git diff --cached --binary "$TARGET_SHA" > "$RESULT_DIR/changes.patch"
          git diff --cached --stat "$TARGET_SHA"

      - name: 変更内容を保存する
        if: steps.request.outputs.kind == 'change'
        uses: actions/upload-artifact@v7
        with:
          name: coding-agent-result
          path: ${{ runner.temp }}/coding-agent-result
          retention-days: 7

  publish:
    needs: work
    if: needs.work.outputs.kind == 'change'
    uses: ./.github/workflows/coding-agent-publish.yml
    permissions:
      contents: read
    with:
      agent: ${{ needs.work.outputs.agent }}
      mode: ${{ inputs.mode }}
      issue-number: ${{ inputs.issue-number }}
      pull-request-number: ${{ inputs.pull-request-number }}
      target-sha: ${{ inputs.target-sha }}
      artifact-name: coding-agent-result
    secrets:
      # Organization か利用するリポジトリの Secrets に登録した、Codex 用の App の秘密鍵
      app-private-key: ${{ secrets.CODING_AGENT_CODEX_PRIVATE_KEY }}

  # 実装計画では、計画から進行役の App で実装タスクの Issue を作る
  tasks:
    needs: work
    if: needs.work.outputs.kind == 'planning'
    uses: ./.github/workflows/coding-agent-tasks.yml
    permissions:
      contents: read
    with:
      planning-issue-number: ${{ inputs.issue-number }}
      artifact-name: coding-agent-plan
    secrets:
      # Organization か利用するリポジトリの Secrets に登録した、進行役の App の秘密鍵
      coordinator-private-key: ${{ secrets.CODING_AGENT_COORDINATOR_PRIVATE_KEY }}

  review:
    name: Codex によるレビュー
    if: vars.CODING_AGENT_ENABLED == 'true' && inputs.mode == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # レビュー担当には書き込み権限を持つトークンを渡さない (レビューの投稿とマージは publish-review ジョブが行う)
    permissions:
      contents: read
      # 依頼の Artifact を、振り分け用のワークフローの実行から取得する
      actions: read
    outputs:
      agent: ${{ steps.request.outputs.agent }}
    steps:
      # 指示やスクリプトは、PR の変更で書き換えられないよう、既定ブランチのものを使う
      - name: 既定ブランチの仕組みをチェックアウトする
        uses: actions/checkout@v7
        with:
          path: trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: レビューする PR をチェックアウトする
        uses: actions/checkout@v7
        with:
          path: pull-request
          ref: ${{ inputs.target-sha }}
          # 依頼に含まれる PR のベースとの差分を確かめられるようにする
          fetch-depth: 0
          persist-credentials: false

      - name: 依頼を取得する
        uses: actions/download-artifact@v8
        with:
          name: coding-agent-requests
          run-id: ${{ inputs.request-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/coding-agent-requests

      - name: 依頼の内容を確かめる
        id: request
        env:
          REQUEST_ID: ${{ inputs.request-id }}
          TARGET_SHA: ${{ inputs.target-sha }}
          REQUEST_DIR: ${{ runner.temp }}/coding-agent-requests
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
            echo "::error::依頼の識別子の形式が正しくありません: $REQUEST_ID"
            exit 1
          fi
          request="$REQUEST_DIR/$REQUEST_ID.json"
          if [ "$(jq -r '.mode' "$request")" != 'review' ] || [ "$(jq -r '.targetSha' "$request")" != "$TARGET_SHA" ]; then
            echo "::error::依頼の内容が、ワークフローの入力と一致しません"
            exit 1
          fi
          echo "agent=$(jq -r '.agent' "$request")" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r '.execution.model // ""' "$request")" >> "$GITHUB_OUTPUT"
          echo "effort=$(jq -r '.execution.effort // ""' "$request")" >> "$GITHUB_OUTPUT"

      - name: レビューの指示を作る
        id: prompt
        env:
          REQUEST_FILE: ${{ runner.temp }}/coding-agent-requests/${{ inputs.request-id }}.json
          REVIEW_DIR: ${{ runner.temp }}/coding-agent-review
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          node trusted/.github/scripts/coding-agent/review-prompt.mjs \
            --request "$REQUEST_FILE" \
            --prompts trusted/.github/coding-agent/prompts/review \
            --prompt-out "$REVIEW_DIR/prompt.md" \
            --review-out "$REVIEW_DIR/review.json"
          if [ -f "$REVIEW_DIR/prompt.md" ]; then
            delimiter="PROMPT_$(openssl rand -hex 16)"
            {
              echo "prompt<<$delimiter"
              cat "$REVIEW_DIR/prompt.md"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi

      # Codex は bubblewrap で、書き込める場所とネットワークを制限する (permission-profile)
      - name: Codex を隔離する bubblewrap を用意する
        if: steps.prompt.outputs.skip-review != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 以降では、AppArmor の既定の設定で、bubblewrap がユーザー名前空間を作れない。
          # 制限が有効なときだけ、bubblewrap 自体に許可を与える (bubblewrap の中で動くコマンドには与えない)
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = '1' ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor
          fi
          bwrap --ro-bind / / --unshare-pid true
          echo "bubblewrap を使えることを確かめました"

      # 変更してよい範囲の外にあるファイルが変更されていれば、Codex を呼ばずに差し戻す (review.json は作成済み)
      - name: Codex でレビューする
        if: steps.prompt.outputs.skip-review != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          working-directory: pull-request
          # ファイルの編集やネットワークへの接続をさせず、読むことだけを許可する
          permission-profile: ':read-only'
          output-schema-file: ${{ github.workspace }}/trusted/.github/coding-agent/review-schema.json
          output-file: ${{ runner.temp }}/coding-agent-review/review.json
          model: ${{ steps.request.outputs.model }}
          effort: ${{ steps.request.outputs.effort }}
          # 振り分け用のワークフロー (github-actions[bot]) からの手動実行を許可する
          allow-bots: true

      - uses: actions/upload-artifact@v7
        with:
          name: coding-agent-review
          path: ${{ runner.temp }}/coding-agent-review/review.json
          retention-days: 7

  publish-review:
    needs: review
    uses: ./.github/workflows/coding-agent-publish-review.yml
    permissions:
      contents: read
      # 差し戻したら、振り分け用のワークフローを手動実行して修正を依頼する
      actions: write
    with:
      agent: ${{ needs.review.outputs.agent }}
      stage: ${{ inputs.stage }}
      pull-request-number: ${{ inputs.pull-request-number }}
      target-sha: ${{ inputs.target-sha }}
      artifact-name: coding-agent-review
    secrets:
      # Organization か利用するリポジトリの Secrets に登録した、Codex 用の App の秘密鍵
      app-private-key: ${{ secrets.CODING_AGENT_CODEX_PRIVATE_KEY }}
