name: Coding Agent (Codex)

# 振り分け用のワークフローが、レビューの依頼ごとに手動実行 (workflow_dispatch) する。
# 入力の形式は、すべてのエージェントのワークフローで共通にしている (仕様の 2.2)。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 依頼の種類 (このワークフローは review だけを受け付ける)
        type: string
        required: true
      stage:
        description: 段階
        type: string
        required: true
      issue-number:
        description: 対象の Issue の番号
        type: string
        required: true
      pull-request-number:
        description: 対象の PR の番号
        type: string
        required: false
        default: ''
      target-sha:
        description: レビューするコミット
        type: string
        required: true
      request-run-id:
        description: 依頼の Artifact を保存した、振り分け用のワークフローの実行の ID
        type: string
        required: true
      request-id:
        description: 依頼の識別子 (Artifact の中のファイル名)
        type: string
        required: true

permissions: {}

# 同じ PR のレビューは、新しい依頼が来たら古いものを取り消し、最新のコミットだけをレビューする
concurrency:
  group: coding-agent-codex-${{ inputs.pull-request-number || inputs.issue-number }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex によるレビュー
    if: vars.CODING_AGENT_ENABLED == 'true' && inputs.mode == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # レビュー担当には書き込み権限を持つトークンを渡さない (レビューの投稿とマージは publish ジョブが行う)
    permissions:
      contents: read
      # 依頼の Artifact を、振り分け用のワークフローの実行から取得する
      actions: read
    outputs:
      agent: ${{ steps.request.outputs.agent }}
    steps:
      # 指示やスクリプトは、PR の変更で書き換えられないよう、既定ブランチのものを使う
      - name: 既定ブランチの仕組みをチェックアウトする
        uses: actions/checkout@v7
        with:
          path: trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: レビューする PR をチェックアウトする
        uses: actions/checkout@v7
        with:
          path: pull-request
          ref: ${{ inputs.target-sha }}
          # 依頼に含まれる PR のベースとの差分を確かめられるようにする
          fetch-depth: 0
          persist-credentials: false

      - name: 依頼を取得する
        uses: actions/download-artifact@v8
        with:
          name: coding-agent-requests
          run-id: ${{ inputs.request-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/coding-agent-requests

      - name: 依頼の内容を確かめる
        id: request
        env:
          REQUEST_ID: ${{ inputs.request-id }}
          TARGET_SHA: ${{ inputs.target-sha }}
          REQUEST_DIR: ${{ runner.temp }}/coding-agent-requests
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
            echo "::error::依頼の識別子の形式が正しくありません: $REQUEST_ID"
            exit 1
          fi
          request="$REQUEST_DIR/$REQUEST_ID.json"
          if [ "$(jq -r '.mode' "$request")" != 'review' ] || [ "$(jq -r '.targetSha' "$request")" != "$TARGET_SHA" ]; then
            echo "::error::依頼の内容が、ワークフローの入力と一致しません"
            exit 1
          fi
          agent="$(jq -r '.agent' "$request")"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r --arg agent "$agent" '.agents[$agent].model // ""' trusted/.github/coding-agent/agents.json)" >> "$GITHUB_OUTPUT"

      - name: レビューの指示を作る
        id: prompt
        env:
          REQUEST_FILE: ${{ runner.temp }}/coding-agent-requests/${{ inputs.request-id }}.json
          REVIEW_DIR: ${{ runner.temp }}/coding-agent-review
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          node trusted/.github/scripts/coding-agent/review-prompt.mjs \
            --request "$REQUEST_FILE" \
            --prompts trusted/.github/coding-agent/prompts/review \
            --prompt-out "$REVIEW_DIR/prompt.md" \
            --review-out "$REVIEW_DIR/review.json"
          if [ -f "$REVIEW_DIR/prompt.md" ]; then
            delimiter="PROMPT_$(openssl rand -hex 16)"
            {
              echo "prompt<<$delimiter"
              cat "$REVIEW_DIR/prompt.md"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi

      # 変更してよい範囲の外にあるファイルが変更されていれば、Codex を呼ばずに差し戻す (review.json は作成済み)
      - name: Codex でレビューする
        if: steps.prompt.outputs.skip-review != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          working-directory: pull-request
          # ファイルの編集やネットワークへの接続をさせず、読むことだけを許可する
          permission-profile: ':read-only'
          output-schema-file: ${{ github.workspace }}/trusted/.github/coding-agent/review-schema.json
          output-file: ${{ runner.temp }}/coding-agent-review/review.json
          model: ${{ steps.request.outputs.model }}
          # 振り分け用のワークフロー (github-actions[bot]) からの手動実行を許可する
          allow-bots: true

      - uses: actions/upload-artifact@v7
        with:
          name: coding-agent-review
          path: ${{ runner.temp }}/coding-agent-review/review.json
          retention-days: 7

  publish:
    name: レビューの投稿
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      # postinstall の husky の初期化を動かさないよう、スクリプトを実行せずにインストールする
      - name: 依存パッケージをインストールする
        run: npm ci --ignore-scripts

      - name: レビューの結果を取得する
        uses: actions/download-artifact@v8
        with:
          name: coding-agent-review
          path: ${{ runner.temp }}/coding-agent-review

      - name: レビュー担当の設定を読み込む
        id: config
        env:
          AGENT: ${{ needs.review.outputs.agent }}
        run: |
          set -euo pipefail
          echo "client-id=$(jq -r --arg agent "$AGENT" '.agents[$agent].appClientId' .github/coding-agent/agents.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r --arg agent "$AGENT" '.agents[$agent].name' .github/coding-agent/agents.json)" >> "$GITHUB_OUTPUT"

      # レビューの投稿 (Approve を含む) と自動マージは、レビュー担当の GitHub App で行う
      - name: レビュー担当の App のトークンを発行する
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.config.outputs.client-id }}
          # Organization か利用するリポジトリの Secrets に登録した、Codex 用の App の秘密鍵
          private-key: ${{ secrets.CODING_AGENT_CODEX_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: レビューを投稿する
        uses: actions/github-script@v9
        env:
          REVIEW_FILE: ${{ runner.temp }}/coding-agent-review/review.json
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
          TARGET_SHA: ${{ inputs.target-sha }}
          STAGE: ${{ inputs.stage }}
          REVIEWER_NAME: ${{ steps.config.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { default: publishReview } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/coding-agent/publish-review.mjs`
            );
            await publishReview({ github, context, core });
