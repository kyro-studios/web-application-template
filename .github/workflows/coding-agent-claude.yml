name: Coding Agent (Claude)

# 振り分け用のワークフローが、作成や修正の依頼ごとに手動実行 (workflow_dispatch) する。
# 入力の形式は、すべてのエージェントのワークフローで共通にしている (仕様の 2.2)。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 依頼の種類 (このワークフローは create と fix を受け付ける)
        type: string
        required: true
      stage:
        description: 段階
        type: string
        required: true
      issue-number:
        description: 対象の Issue の番号
        type: string
        required: true
      pull-request-number:
        description: 対象の PR の番号 (作成のときは空)
        type: string
        required: false
        default: ''
      target-sha:
        description: 作業を始めるコミット (修正のときは、PR の head)
        type: string
        required: true
      request-run-id:
        description: 依頼の Artifact を保存した、振り分け用のワークフローの実行の ID
        type: string
        required: true
      request-id:
        description: 依頼の識別子 (Artifact の中のファイル名)
        type: string
        required: true

permissions: {}

# 同じ Issue や PR への作業は、1 つずつ行う (作業の途中で取り消さない)
concurrency:
  group: coding-agent-claude-${{ inputs.pull-request-number || inputs.issue-number }}
  cancel-in-progress: false

jobs:
  work:
    name: Claude による作業
    if: vars.CODING_AGENT_ENABLED == 'true' && (inputs.mode == 'create' || inputs.mode == 'fix')
    runs-on: ubuntu-latest
    # 実装タスクでは、ビルドやテストを実行するため、時間の上限を長くする
    timeout-minutes: ${{ inputs.stage == 'implementation' && 90 || 60 }}
    # 作成担当には書き込み権限を持つトークンを渡さない (push と PR の作成は publish ジョブが行う)
    permissions:
      contents: read
      issues: read
      pull-requests: read
      # 依頼の Artifact を、振り分け用のワークフローの実行から取得する
      actions: read
    outputs:
      agent: ${{ steps.request.outputs.agent }}
      kind: ${{ steps.request.outputs.kind }}
    steps:
      - name: 作業を始めるコミットをチェックアウトする
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false

      # 指示やスクリプトは既定ブランチのものを使い、作業ディレクトリの外に置く (変更内容に含めないため)
      - name: 既定ブランチの仕組みをチェックアウトする
        uses: actions/checkout@v7
        with:
          path: coding-agent-trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: 既定ブランチの仕組みを作業ディレクトリの外に移す
        run: mv coding-agent-trusted "$RUNNER_TEMP/trusted"

      - name: 依頼を取得する
        uses: actions/download-artifact@v8
        with:
          name: coding-agent-requests
          run-id: ${{ inputs.request-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/coding-agent-requests

      - name: 依頼の内容を確かめる
        id: request
        env:
          REQUEST_ID: ${{ inputs.request-id }}
          MODE: ${{ inputs.mode }}
          TARGET_SHA: ${{ inputs.target-sha }}
          REQUEST_DIR: ${{ runner.temp }}/coding-agent-requests
          TRUSTED: ${{ runner.temp }}/trusted
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
            echo "::error::依頼の識別子の形式が正しくありません: $REQUEST_ID"
            exit 1
          fi
          request="$REQUEST_DIR/$REQUEST_ID.json"
          if [ "$(jq -r '.mode' "$request")" != "$MODE" ] || [ "$(jq -r '.targetSha' "$request")" != "$TARGET_SHA" ]; then
            echo "::error::依頼の内容が、ワークフローの入力と一致しません"
            exit 1
          fi
          agent="$(jq -r '.agent' "$request")"
          model="$(jq -r --arg agent "$agent" '.agents[$agent].model // ""' "$TRUSTED/.github/coding-agent/agents.json")"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "model-args=$([ -n "$model" ] && printf -- '--model %s' "$model")" >> "$GITHUB_OUTPUT"
          # 実装計画は、ファイルを変更せずに計画を出力する。それ以外は、ファイルを変更してコミットメッセージなどを出力する。
          # 実装タスクでは、ビルドやテストを確かめられるよう、コマンドの実行 (Bash) も許可する
          case "$(jq -r '.stage' "$request")" in
            planning)
              echo "kind=planning" >> "$GITHUB_OUTPUT"
              echo "tools=Read,Glob,Grep" >> "$GITHUB_OUTPUT"
              echo "output-schema=$(jq -c . "$TRUSTED/.github/coding-agent/plan-schema.json")" >> "$GITHUB_OUTPUT"
              ;;
            implementation)
              echo "kind=change" >> "$GITHUB_OUTPUT"
              echo "tools=Read,Edit,Write,Glob,Grep,Bash" >> "$GITHUB_OUTPUT"
              echo "output-schema=$(jq -c . "$TRUSTED/.github/coding-agent/result-schema.json")" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "kind=change" >> "$GITHUB_OUTPUT"
              echo "tools=Read,Edit,Write,Glob,Grep" >> "$GITHUB_OUTPUT"
              echo "output-schema=$(jq -c . "$TRUSTED/.github/coding-agent/result-schema.json")" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: 作業の指示を作る
        id: prompt
        env:
          REQUEST_FILE: ${{ runner.temp }}/coding-agent-requests/${{ inputs.request-id }}.json
          TRUSTED: ${{ runner.temp }}/trusted
        run: |
          set -euo pipefail
          node "$TRUSTED/.github/scripts/coding-agent/author-prompt.mjs" \
            --request "$REQUEST_FILE" \
            --prompts "$TRUSTED/.github/coding-agent/prompts" \
            --prompt-out "$RUNNER_TEMP/author-prompt.md"
          delimiter="PROMPT_$(openssl rand -hex 16)"
          {
            echo "prompt<<$delimiter"
            cat "$RUNNER_TEMP/author-prompt.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # 子プロセスの環境変数から認証情報を取り除く設定 (次のステップ) には、bubblewrap が必要
      - name: コマンドを隔離する bubblewrap を用意する
        if: inputs.stage == 'implementation'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 以降では、AppArmor の既定の設定で、bubblewrap がユーザー名前空間を作れない。
          # 制限が有効なときだけ、bubblewrap 自体に許可を与える (bubblewrap の中で動くコマンドには与えない)
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = '1' ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor
          fi
          bwrap --ro-bind / / --unshare-pid true
          echo "bubblewrap を使えることを確かめました"

      - name: Claude Code で作業する
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # 実装タスクでは、Bash などの子プロセスの環境変数から、API キーなどの認証情報を取り除く
          # (Claude Code 本体は API の呼び出しに使い続ける)。GITHUB_TOKEN は取り除かれないため、ジョブの permissions を読み取りだけにしている
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ inputs.stage == 'implementation' && '1' || '0' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 読み取り専用の GITHUB_TOKEN を渡し、Claude GitHub App の書き込み可能なトークンを使わせない
          github_token: ${{ github.token }}
          # 振り分け用のワークフロー (github-actions[bot]) からの手動実行を許可する
          allowed_bots: github-actions
          # 文書の段階ではファイルを読み書きするだけ、実装計画では読むだけで、コマンドは実行しない。
          # 実装タスクでは、コマンドも実行する
          claude_args: >-
            --allowedTools "${{ steps.request.outputs.tools }}"
            --json-schema '${{ steps.request.outputs.output-schema }}'
            ${{ steps.request.outputs.model-args }}
          prompt: ${{ steps.prompt.outputs.prompt }}

      - name: 計画をまとめる
        if: steps.request.outputs.kind == 'planning'
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          PLAN_DIR: ${{ runner.temp }}/coding-agent-plan
        run: |
          set -euo pipefail
          if [ -z "$STRUCTURED_OUTPUT" ]; then
            echo "::error::作成担当が計画を出力しませんでした"
            exit 1
          fi
          mkdir -p "$PLAN_DIR"
          printf '%s' "$STRUCTURED_OUTPUT" > "$PLAN_DIR/plan.json"
          jq . "$PLAN_DIR/plan.json"

      - name: 計画を保存する
        if: steps.request.outputs.kind == 'planning'
        uses: actions/upload-artifact@v7
        with:
          name: coding-agent-plan
          path: ${{ runner.temp }}/coding-agent-plan
          retention-days: 30

      - name: 変更内容をまとめる
        if: steps.request.outputs.kind == 'change'
        env:
          TARGET_SHA: ${{ inputs.target-sha }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          RESULT_DIR: ${{ runner.temp }}/coding-agent-result
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          printf '%s' "$STRUCTURED_OUTPUT" > "$RESULT_DIR/result.json"
          # エージェントが指示に反してコミットしていても漏れないよう、作業を始めたコミットと比較する
          git add --all
          git diff --cached --binary "$TARGET_SHA" > "$RESULT_DIR/changes.patch"
          git diff --cached --stat "$TARGET_SHA"

      - name: 変更内容を保存する
        if: steps.request.outputs.kind == 'change'
        uses: actions/upload-artifact@v7
        with:
          name: coding-agent-result
          path: ${{ runner.temp }}/coding-agent-result
          retention-days: 7

  publish:
    needs: work
    if: needs.work.outputs.kind == 'change'
    uses: ./.github/workflows/coding-agent-publish.yml
    permissions:
      contents: read
    with:
      agent: ${{ needs.work.outputs.agent }}
      mode: ${{ inputs.mode }}
      issue-number: ${{ inputs.issue-number }}
      pull-request-number: ${{ inputs.pull-request-number }}
      target-sha: ${{ inputs.target-sha }}
      artifact-name: coding-agent-result
    secrets:
      # Organization か利用するリポジトリの Secrets に登録した、Claude 用の App の秘密鍵
      app-private-key: ${{ secrets.CODING_AGENT_CLAUDE_PRIVATE_KEY }}

  # 実装計画では、計画から進行役の App で実装タスクの Issue を作る
  tasks:
    needs: work
    if: needs.work.outputs.kind == 'planning'
    uses: ./.github/workflows/coding-agent-tasks.yml
    permissions:
      contents: read
    with:
      planning-issue-number: ${{ inputs.issue-number }}
      artifact-name: coding-agent-plan
    secrets:
      # Organization か利用するリポジトリの Secrets に登録した、進行役の App の秘密鍵
      coordinator-private-key: ${{ secrets.CODING_AGENT_COORDINATOR_PRIVATE_KEY }}
