name: Coding Agent Router

on:
  issues:
    types: [opened, edited, assigned, closed]
  # 振り分けの処理は既定ブランチのものを使い、PR のコードは実行しない (PR の変更で振り分けを書き換えられないようにする)
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, unlabeled]
  workflow_dispatch:
    inputs:
      issue-number:
        description: 対象の Issue 番号
        type: string
        required: true
      force:
        description: 起動済みでも再実行する
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  route:
    name: 振り分け
    # テンプレート自体や、セットアップ前のリポジトリでは、ランナーを起動せずに終える
    if: vars.CODING_AGENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 同じ Issue や PR のイベントは 1 つずつ処理する (段階の Issue を二重に作らないため)。
    # PR は新しい push があれば古いものを取り消し、最新のコミットだけをレビューに回す
    concurrency:
      group: coding-agent-router-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue-number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      dispatches: ${{ steps.route.outputs.dispatches }}
      redispatch-issues: ${{ steps.route.outputs.redispatch-issues }}
    steps:
      # cone モードでは、ルート直下のファイル (package.json など) もチェックアウトされる
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      # postinstall の husky の初期化を動かさないよう、スクリプトを実行せずにインストールする
      - name: 依存パッケージをインストールする
        run: npm ci --ignore-scripts

      # 読み取り専用の GITHUB_TOKEN で判定し、処理するイベントのときだけ進行役の App のトークンを発行する
      - name: 振り分けの対象か判定する
        id: match
        uses: actions/github-script@v9
        with:
          script: |
            const { match } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/coding-agent/route.mjs`
            );
            await match({ github, context, core });

      - name: 進行役の App のトークンを発行する
        id: app-token
        if: steps.match.outputs.handled == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.match.outputs.coordinator-client-id }}
          # Organization か利用するリポジトリの Secrets に登録した、進行役の App の秘密鍵
          private-key: ${{ secrets.CODING_AGENT_COORDINATOR_PRIVATE_KEY }}
          permission-issues: write
          # PR へのコメント、ラベル付け、Assign (修正の依頼や人への引き継ぎ) に使う
          permission-pull-requests: write
          permission-contents: read

      - name: 振り分ける
        id: route
        if: steps.match.outputs.handled == 'true'
        uses: actions/github-script@v9
        env:
          REQUEST_DIR: ${{ runner.temp }}/coding-agent-requests
          # エージェントが修正する回数の上限 (未設定なら 3)
          REVIEW_MAX_FIX_ROUNDS: ${{ vars.REVIEW_MAX_FIX_ROUNDS }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { route } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/coding-agent/route.mjs`
            );
            await route({ github, context, core });

      - name: エージェントへの依頼を保存する
        if: steps.route.outputs.dispatches != '' && steps.route.outputs.dispatches != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: coding-agent-requests
          path: ${{ runner.temp }}/coding-agent-requests
          retention-days: 7

  dispatch:
    name: エージェントの呼び出し
    needs: route
    if: >-
      (needs.route.outputs.dispatches != '' && needs.route.outputs.dispatches != '[]') ||
      (needs.route.outputs.redispatch-issues != '' && needs.route.outputs.redispatch-issues != '[]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: エージェントと振り分けのワークフローを手動実行する
        uses: actions/github-script@v9
        env:
          DISPATCHES: ${{ needs.route.outputs.dispatches }}
          REDISPATCH_ISSUES: ${{ needs.route.outputs.redispatch-issues }}
        with:
          script: |
            const { default: dispatchAgents } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/coding-agent/dispatch-agents.mjs`
            );
            await dispatchAgents({ github, context, core });
