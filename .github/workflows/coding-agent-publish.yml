name: Coding Agent Publish

# エージェントのワークフローから呼び出す、共通の書き込みジョブ。
# エージェントが作った変更を、そのエージェントの GitHub App のトークンで push する。
# 作成のときは新しいブランチに push して PR を作成し、修正のときは PR のブランチに push する。
# エージェントには書き込み権限を持つトークンを渡さず、このジョブだけが書き込む (仕様の 2.3)。
on:
  workflow_call:
    inputs:
      agent:
        description: エージェントの識別子 (agents.json のキー)
        type: string
        required: true
      mode:
        description: 依頼の種類 (create か fix)
        type: string
        required: true
      issue-number:
        description: 対象の Issue の番号
        type: string
        required: true
      pull-request-number:
        description: 修正の対象の PR の番号 (作成のときは空)
        type: string
        required: false
        default: ''
      target-sha:
        description: エージェントが作業を始めたコミット
        type: string
        required: true
      artifact-name:
        description: 変更内容 (changes.patch) とエージェントの出力 (result.json) を含む Artifact の名前
        type: string
        required: true
      merge-sha:
        description: コンフリクトの修正で取り込んだ既定ブランチのコミット (それ以外は空)。指定すると、マージのコミットとして push する
        type: string
        required: false
        default: ''
    secrets:
      app-private-key:
        description: エージェントの GitHub App の秘密鍵
        required: true

permissions: {}

jobs:
  publish:
    name: 変更の push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 依頼の種類を確かめる
        if: inputs.mode != 'create' && inputs.mode != 'fix'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo "::error::依頼の種類 $MODE には対応していません"
          exit 1

      - name: 既定ブランチの設定をチェックアウトする
        uses: actions/checkout@v7
        with:
          path: trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: エージェントの設定を読み込む
        id: config
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          set -euo pipefail
          agents=trusted/.github/coding-agent/agents.json
          if [ "$(jq --arg agent "$AGENT" '.agents | has($agent)' "$agents")" != 'true' ]; then
            echo "::error::エージェント $AGENT は agents.json に登録されていません"
            exit 1
          fi
          echo "client-id=$(jq -r --arg agent "$AGENT" '.agents[$agent].appClientId' "$agents")" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r --arg agent "$AGENT" '.agents[$agent].name' "$agents")" >> "$GITHUB_OUTPUT"

      - name: エージェントの App のトークンを発行する
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.config.outputs.client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          path: work
          ref: ${{ inputs.target-sha }}
          token: ${{ steps.app-token.outputs.token }}
          # コンフリクトの修正では、マージのために共通の祖先が要るため、履歴をすべて取得する
          fetch-depth: ${{ inputs.merge-sha != '' && '0' || '1' }}

      - name: エージェントの作業結果を取得する
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/coding-agent-result

      - name: コミットして PR を作成する
        if: inputs.mode == 'create'
        working-directory: work
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          AGENT: ${{ inputs.agent }}
          AGENT_NAME: ${{ steps.config.outputs.name }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RESULT_DIR: ${{ runner.temp }}/coding-agent-result
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          patch="$RESULT_DIR/changes.patch"
          result="$RESULT_DIR/result.json"

          if [ ! -s "$patch" ]; then
            # プロジェクトの作成では、今の土台のままでよければ、変更が要らない理由を出力する。
            # 理由をコメントして Issue を Close し、次の段階に進める (仕様の 10.1)
            unchanged_reason="$(jq -r '.unchanged_reason // empty' "$result" 2>/dev/null || true)"
            if [ -n "$unchanged_reason" ]; then
              body_file="$RUNNER_TEMP/unchanged-reason.md"
              {
                printf '🤖 %s は、変更が要らないと判断しました。理由は次のとおりです ([ワークフロー](%s))。\n\n' "$AGENT_NAME" "$RUN_URL"
                printf '%s\n' "$unchanged_reason"
              } > "$body_file"
              gh issue comment "$ISSUE_NUMBER" --body-file "$body_file"
              gh issue close "$ISSUE_NUMBER" --reason completed
              exit 0
            fi
            gh issue comment "$ISSUE_NUMBER" --body "🤖 ${AGENT_NAME} は変更を作成しませんでした。詳細は [ワークフロー]($RUN_URL) のログを確認してください。"
            echo "::error::エージェントが変更を作成しませんでした"
            exit 1
          fi

          # エージェントの出力が壊れていても PR を作成できるよう、既定値を用意しておく
          commit_message="$(jq -r '.commit_message // empty' "$result" 2>/dev/null || true)"
          pull_request_body="$(jq -r '.pull_request_body // empty' "$result" 2>/dev/null || true)"
          if [ -z "$commit_message" ]; then
            echo "::warning::エージェントがコミットメッセージを出力しなかったため、既定値を使います"
            commit_message="chore: resolve #${ISSUE_NUMBER}"
          fi
          # コミットメッセージは 1 行目だけにする。develop には squash で PR のタイトルだけが残るため、本文はどこにも残らない。
          # 本文の行の長さで commitlint が失敗しないよう、本文を含めない (変更の説明は PR の説明に残る)
          commit_message="$(printf '%s\n' "$commit_message" | head -n 1)"
          title="$commit_message"

          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" --jq .id)"
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"

          branch="coding-agent/${AGENT}/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          git apply --index --binary "$patch"
          git commit --file - <<< "$commit_message"
          git push origin "$branch"

          body_file="$RUNNER_TEMP/pull-request-body.md"
          {
            if [ -n "$pull_request_body" ]; then
              printf '%s\n\n' "$pull_request_body"
            fi
            printf 'Closes #%s\n\n' "$ISSUE_NUMBER"
            printf -- '---\n🤖 この PR は %s が自動で作成しました ([ワークフロー](%s))\n' "$AGENT_NAME" "$RUN_URL"
          } > "$body_file"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "$title" \
            --body-file "$body_file"

      # 修正の差分は、修正を始めたコミット (PR の head) をもとにしているため、head が進んでいれば push しない
      - name: PR のブランチに修正をコミットして push する
        if: inputs.mode == 'fix'
        working-directory: work
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          AGENT_NAME: ${{ steps.config.outputs.name }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
          TARGET_SHA: ${{ inputs.target-sha }}
          MERGE_SHA: ${{ inputs.merge-sha }}
          RESULT_DIR: ${{ runner.temp }}/coding-agent-result
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          patch="$RESULT_DIR/changes.patch"
          result="$RESULT_DIR/result.json"

          if [ -n "$MERGE_SHA" ] && [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::取り込むコミットの SHA が正しくありません: $MERGE_SHA"
            exit 1
          fi

          read -r head_ref head_sha state < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" --jq '[.head.ref, .head.sha, .state] | @tsv')
          if [ "$state" != 'open' ] || [ "$head_sha" != "$TARGET_SHA" ]; then
            echo "::notice::#$PULL_REQUEST_NUMBER は修正を始めた後に更新されたか Close されたため、push しません"
            exit 0
          fi

          if [ ! -s "$patch" ]; then
            gh pr comment "$PULL_REQUEST_NUMBER" --body "🤖 ${AGENT_NAME} は修正を作成しませんでした。詳細は [ワークフロー]($RUN_URL) のログを確認してください。"
            echo "::error::エージェントが修正を作成しませんでした"
            exit 1
          fi

          commit_message="$(jq -r '.commit_message // empty' "$result" 2>/dev/null || true)"
          summary="$(jq -r '.pull_request_body // empty' "$result" 2>/dev/null || true)"
          if [ -z "$commit_message" ]; then
            echo "::warning::エージェントがコミットメッセージを出力しなかったため、既定値を使います"
            commit_message="fix: address review comments on #${PULL_REQUEST_NUMBER}"
          fi
          # 作成のときと同じく、コミットメッセージは 1 行目だけにする (修正の説明は PR のコメントに残る)
          commit_message="$(printf '%s\n' "$commit_message" | head -n 1)"

          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" --jq .id)"
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"

          # コンフリクトの修正では、エージェントと同じ既定ブランチのコミットを、中身を変えずに (-s ours) マージの途中の状態にする。
          # そこへ、PR の head から解消した後の状態までの差分を当てると、中身が解消した後の状態の、マージのコミットになる
          if [ -n "$MERGE_SHA" ]; then
            git fetch --no-tags origin "$MERGE_SHA"
            git merge --no-ff --no-commit -s ours "$MERGE_SHA"
          fi
          git apply --index --binary "$patch"
          git commit --file - <<< "$commit_message"
          # 修正を始めたコミットからの fast-forward だけを許す (その間に push された変更を上書きしない)
          git push origin "HEAD:refs/heads/${head_ref}"

          # 修正の回数は、この印の付いたコメントで数える (仕様の 9.4)
          body_file="$RUNNER_TEMP/fix-comment.md"
          {
            printf '🤖 %s が修正しました ([ワークフロー](%s))。\n\n' "$AGENT_NAME" "$RUN_URL"
            if [ -n "$summary" ]; then
              printf '%s\n\n' "$summary"
            fi
            printf '<!-- coding-agent-fix -->\n'
          } > "$body_file"
          gh pr comment "$PULL_REQUEST_NUMBER" --body-file "$body_file"
