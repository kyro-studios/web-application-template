name: Coding Agent Publish

# エージェントのワークフローから呼び出す、共通の書き込みジョブ。
# エージェントが作った変更を、そのエージェントの GitHub App のトークンで push し、PR を作成する。
# エージェントには書き込み権限を持つトークンを渡さず、このジョブだけが書き込む (仕様の 2.3)。
on:
  workflow_call:
    inputs:
      agent:
        description: エージェントの識別子 (agents.json のキー)
        type: string
        required: true
      mode:
        description: 依頼の種類 (今は create だけに対応する)
        type: string
        required: true
      issue-number:
        description: 対象の Issue の番号
        type: string
        required: true
      target-sha:
        description: エージェントが作業を始めたコミット
        type: string
        required: true
      artifact-name:
        description: 変更内容 (changes.patch) とエージェントの出力 (result.json) を含む Artifact の名前
        type: string
        required: true
    secrets:
      app-private-key:
        description: エージェントの GitHub App の秘密鍵
        required: true

permissions: {}

jobs:
  publish:
    name: PR の作成
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 依頼の種類を確かめる
        if: inputs.mode != 'create'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo "::error::依頼の種類 $MODE には、まだ対応していません"
          exit 1

      - name: 既定ブランチの設定をチェックアウトする
        uses: actions/checkout@v7
        with:
          path: trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: エージェントの設定を読み込む
        id: config
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          set -euo pipefail
          agents=trusted/.github/coding-agent/agents.json
          if [ "$(jq --arg agent "$AGENT" '.agents | has($agent)' "$agents")" != 'true' ]; then
            echo "::error::エージェント $AGENT は agents.json に登録されていません"
            exit 1
          fi
          echo "client-id=$(jq -r --arg agent "$AGENT" '.agents[$agent].appClientId' "$agents")" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r --arg agent "$AGENT" '.agents[$agent].name' "$agents")" >> "$GITHUB_OUTPUT"

      - name: エージェントの App のトークンを発行する
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.config.outputs.client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          path: work
          ref: ${{ inputs.target-sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: エージェントの作業結果を取得する
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/coding-agent-result

      - name: コミットして PR を作成する
        working-directory: work
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          AGENT: ${{ inputs.agent }}
          AGENT_NAME: ${{ steps.config.outputs.name }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RESULT_DIR: ${{ runner.temp }}/coding-agent-result
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          patch="$RESULT_DIR/changes.patch"
          result="$RESULT_DIR/result.json"

          if [ ! -s "$patch" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "🤖 ${AGENT_NAME} は変更を作成しませんでした。詳細は [ワークフロー]($RUN_URL) のログを確認してください。"
            echo "::error::エージェントが変更を作成しませんでした"
            exit 1
          fi

          # エージェントの出力が壊れていても PR を作成できるよう、既定値を用意しておく
          commit_message="$(jq -r '.commit_message // empty' "$result" 2>/dev/null || true)"
          pull_request_body="$(jq -r '.pull_request_body // empty' "$result" 2>/dev/null || true)"
          if [ -z "$commit_message" ]; then
            echo "::warning::エージェントがコミットメッセージを出力しなかったため、既定値を使います"
            commit_message="chore: resolve #${ISSUE_NUMBER}"
          fi
          title="$(printf '%s\n' "$commit_message" | head -n 1)"

          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" --jq .id)"
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"

          branch="coding-agent/${AGENT}/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          git apply --index --binary "$patch"
          git commit --file - <<< "$commit_message"
          git push origin "$branch"

          body_file="$RUNNER_TEMP/pull-request-body.md"
          {
            if [ -n "$pull_request_body" ]; then
              printf '%s\n\n' "$pull_request_body"
            fi
            printf 'Closes #%s\n\n' "$ISSUE_NUMBER"
            printf -- '---\n🤖 この PR は %s が自動で作成しました ([ワークフロー](%s))\n' "$AGENT_NAME" "$RUN_URL"
          } > "$body_file"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "$title" \
            --body-file "$body_file"
